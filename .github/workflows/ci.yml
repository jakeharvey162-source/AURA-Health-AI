name: AURA release gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build

      - name: Install browser test runner
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile patient interactions
        run: node tests/browser.mjs
